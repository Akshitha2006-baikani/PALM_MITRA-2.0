<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Palm Mitra</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🌴
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Sign in to continue to Palm Mitra
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
